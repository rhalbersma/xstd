name: Clang-Tidy

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tidy:
    name: clang-tidy 22
    runs-on: ubuntu-24.04
    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_CACHE_KEY: vcpkg-clang-tidy-

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image writes APT::Acquire::Retries, but apt reads this
      # setting from the Acquire group, so the image's value never takes
      # effect. Set the key apt actually consults: without it a transient
      # 5xx from a mirror or PPA fails the install on the first attempt,
      # which is how one Launchpad brownout reddened three required legs.
      - name: Make apt retry transient download failures
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99-retries > /dev/null

      - name: Install Clang 22 and clang-tidy 22
        run: |
          wget --tries=3 --waitretry=5 --retry-on-http-error=429,500,502,503,504 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-tidy-22

      # xstd/cstdlib.hpp's div_t formatter needs libstdc++'s <format> (and,
      # more specifically, its std::formatter<tuple> support), so this
      # installs a known-good g++ purely for its libstdc++, regardless of
      # what the runner image's default GCC ships. Clang doesn't bundle its
      # own standard library for -stdlib=libstdc++; it auto-selects the
      # newest GCC installation's headers/runtime it can find, so this is
      # enough. Matches clang.yml's own fix for the same underlying problem.
      - name: Install a <format>-capable libstdc++
        run: |
          # Retried for the reason given in gcc.yml: the ppa: shorthand goes
          # through Launchpad's web API, which Acquire::Retries does not cover.
          for i in 1 2 3; do
            if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
          sudo apt-get update
          sudo apt-get install -y g++-15

      # x-gha, vcpkg's built-in GitHub Actions cache backend, was removed
      # from vcpkg; actions/cache still works, so cache the directory vcpkg
      # writes its binary packages to. The archives in it are named by
      # vcpkg's ABI hash, so a stale entry is ignored rather than reused.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      # Only needed so that the test tree (and with it the compile database
      # entries below) configures; clang-tidy itself never links Boost.
      - name: Install Boost.Test
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          vcpkg install --triplet x64-linux

      # Save only when the archives changed, keyed on their contents: an
      # unconditional save would add an entry per run, evicting this repo's
      # other caches, or warn about a duplicate key on every cache hit.
      - name: Save vcpkg binary cache
        if: >-
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      # Debug rather than an unset build type: leaving it unset already
      # leaves NDEBUG undefined, which is what matters here, but it does so
      # by accident and is one preset change away from silently becoming
      # Release. CMake's Release adds -DNDEBUG, which rewrites every
      # assert(...) to ((void)0) before it reaches the AST - 14 of them
      # across cstdlib.hpp and utility.hpp - which would disable
      # bugprone-assert-side-effect outright and strip the assertions
      # clang-analyzer-* uses to prune infeasible paths. Matches codeql.yml.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-22
          -DCMAKE_CXX_COMPILER=clang++-22
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake

      # Analyze the public headers through the generated header
      # self-sufficiency translation units. The check selection and
      # per-check suppressions live in .clang-tidy; WarningsAsErrors there
      # makes any finding fail this job.
      #
      # "shell: bash" rather than the default shell, in both this step and
      # the next: the default is "bash -e {0}", with no -o pipefail, so the
      # exit status of these pipelines would be tee's rather than
      # clang-tidy's and no finding could ever redden the job. Naming the
      # shell explicitly gets "bash --noprofile --norc -eo pipefail {0}".
      - name: Run clang-tidy over the public headers
        shell: bash
        run: |
          run-clang-tidy-22 -quiet -p build \
            "$GITHUB_WORKSPACE/build/test/header_self_sufficiency/.*" \
            2>&1 | tee clang-tidy-report.txt

      # Compiling a file that includes a header proves only transitive
      # self-sufficiency: it cannot tell whether a standard-library name came
      # from the header that owns it. Analyze each header as the primary input
      # as well, so misc-include-cleaner can enforce direct includes and reject
      # unused ones. Aggregate headers mark their component includes with
      # IWYU export pragmas, so this workflow needs no brittle exclusion list.
      - name: Check direct header dependencies
        shell: bash
        run: |
          mapfile -d '' headers < <(
            find include/xstd -type f -name '*.hpp' \
              ! -path 'include/xstd/config/*' \
              -print0
          )
          for header in "${headers[@]}"; do
            clang-tidy-22 "$header" -- \
              -x c++-header -std=c++23 -Iinclude
          done 2>&1 | tee -a clang-tidy-report.txt

      # The Boost.Test sources, under test/.clang-tidy, which inherits the
      # root configuration and drops the three checks that only misfire on
      # fixtures. Analyzed second rather than in the same pass, so that a
      # finding names the tree whose rulebook it came from; a red headers
      # step stops this one, which is the right order to fix them in anyway.
      - name: Run clang-tidy over the test sources
        shell: bash
        run: |
          run-clang-tidy-22 -quiet -p build \
            "$GITHUB_WORKSPACE/test/src/.*" \
            2>&1 | tee -a clang-tidy-report.txt

      - name: Publish clang-tidy summary
        if: always()
        run: |
          {
            echo '### clang-tidy findings'
            echo '```'
            grep -E ': (error|warning):' clang-tidy-report.txt || echo 'No findings.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt
