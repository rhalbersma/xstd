name: Clang-Tidy

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tidy:
    name: clang-tidy 22
    runs-on: ubuntu-24.04
    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_CACHE_KEY: vcpkg-clang-tidy-

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image writes APT::Acquire::Retries, which apt does not read;
      # this is the key it consults, so a transient 5xx retries.
      - name: Make apt retry transient download failures
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99-retries > /dev/null

      - name: Install Clang 22 and clang-tidy 22
        run: |
          wget --tries=3 --waitretry=5 --retry-on-http-error=429,500,502,503,504 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-tidy-22

      # A known-good g++ purely for its libstdc++, the div_result formatter needing
      # std::formatter<tuple>; Clang picks up the newest one it finds.
      - name: Install a <format>-capable libstdc++
        run: |
          # Retried for the reason given in gcc.yml: the ppa: shorthand goes
          # through Launchpad's web API, which Acquire::Retries does not cover.
          for i in 1 2 3; do
            if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
          sudo apt-get update
          sudo apt-get install -y g++-15

      # vcpkg's own x-gha backend was removed, so cache its binary packages
      # with actions/cache; the archives are named by ABI hash.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      # Only needed so that the test tree (and with it the compile database
      # entries below) configures; clang-tidy itself never links Boost.
      - name: Install Boost.Test
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          vcpkg install --triplet x64-linux

      # Keyed on the archives' contents: an unconditional save would add an
      # entry per run and evict this repo's other caches.
      - name: Save vcpkg binary cache
        if: >-
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      # Debug rather than unset, so NDEBUG stays undefined on purpose: -DNDEBUG
      # rewrites every assert before the AST, which these checks read.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-22
          -DCMAKE_CXX_COMPILER=clang++-22
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake

      # The public headers, through the generated self-sufficiency units.
      # "shell: bash" for the -o pipefail, without which tee's status wins.
      - name: Run clang-tidy over the public headers
        shell: bash
        run: |
          run-clang-tidy-22 -quiet -p build \
            "$GITHUB_WORKSPACE/build/test/header_self_sufficiency/.*" \
            2>&1 | tee clang-tidy-report.txt

      # Each header as the primary input too, so misc-include-cleaner can tell
      # a direct include from a transitive one. Aggregates carry IWYU pragmas.
      - name: Check direct header dependencies
        shell: bash
        run: |
          mapfile -d '' headers < <(
            find include/xstd -type f -name '*.hpp' \
              ! -path 'include/xstd/config/*' \
              -print0
          )
          for header in "${headers[@]}"; do
            clang-tidy-22 "$header" -- \
              -x c++-header -std=c++23 -Iinclude
          done 2>&1 | tee -a clang-tidy-report.txt

      # The test sources, under test/.clang-tidy. A separate pass so a finding
      # names the tree whose rulebook it came from.
      - name: Run clang-tidy over the test sources
        shell: bash
        run: |
          run-clang-tidy-22 -quiet -p build \
            "$GITHUB_WORKSPACE/test/src/.*" \
            2>&1 | tee -a clang-tidy-report.txt

      - name: Publish clang-tidy summary
        if: always()
        run: |
          {
            echo '### clang-tidy findings'
            echo '```'
            grep -E ': (error|warning):' clang-tidy-report.txt || echo 'No findings.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt
