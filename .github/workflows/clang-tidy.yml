name: Clang-Tidy

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  clang_tidy:
    uses: rhalbersma/cpp-ci/.github/workflows/clang-tidy.yml@676e6fb7abc784e54a227998bf3e9c39790e63cf # v0.8.0
    with:
      # The generated per-header units and the test sources, as run-clang-tidy
      # matches them against the compile database's absolute paths.
      self_sufficiency_regex: ${{ github.workspace }}/build/test/header_self_sufficiency/.*
      sources_regex: ${{ github.workspace }}/test/src/.*
      # config/ is generated per platform and not a public header.
      header_exclude: include/xstd/config/*
      # The ext/ headers need the library each adapts, which Configure fetches.
      adapted_dirs: build/_deps/absl_int128-src build/_deps/boost_int128-src/include
