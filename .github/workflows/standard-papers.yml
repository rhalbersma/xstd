name: Standard papers

on:
  push:
    paths:
      - '**.md'
      - tools/check_standard_papers.py
      - .github/workflows/standard-papers.yml
  pull_request:
    paths:
      - '**.md'
      - tools/check_standard_papers.py
      - .github/workflows/standard-papers.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check standards-paper references
        run: python3 tools/check_standard_papers.py
