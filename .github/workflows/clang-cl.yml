name: Clang-CL

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    # Clang's diagnostics against the MSVC STL, on whichever LLVM each Visual
    # Studio bundles; the Preview row retests the stable driver against it.
    name: Clang-CL VS ${{ matrix.vs }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        vs: [2022, 2026, 2026-Preview]
        include:
          - vs: 2022
            os: windows-2022
            generator: "Visual Studio 17 2022"
            toolset: "ClangCL,host=x64"
            arch: x64
            triplet: x64-windows
            preview_channel: false
          - vs: 2026
            os: windows-2025
            generator: "Visual Studio 18 2026"
            toolset: "ClangCL,host=x64"
            arch: x64
            triplet: x64-windows
            preview_channel: false
          - vs: 2026-Preview
            os: windows-2025
            generator: "Visual Studio 18 2026"
            arch: x64
            triplet: x64-windows
            preview_channel: true
    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_CACHE_KEY: vcpkg-clang-cl-${{ matrix.vs }}-

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cache the preview installer payload by channel-manifest revision.
      # Without this, the optional toolset would be downloaded on every run.
      - name: Resolve preview channel manifest version
        if: matrix.preview_channel
        id: preview-channel
        shell: pwsh
        run: |
          $resp = Invoke-WebRequest -Uri 'https://aka.ms/vs/18/pre/channel' -Method Head -UseBasicParsing
          $version = $resp.Headers['ETag']
          if (-not $version) { $version = $resp.Headers['Last-Modified'] }
          Write-Host "Channel manifest version: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache VS Installer package downloads
        if: matrix.preview_channel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\ProgramData\Microsoft\VisualStudio\Packages
          key: vs-preview-packages-${{ runner.os }}-${{ steps.preview-channel.outputs.version }}
          restore-keys: |
            vs-preview-packages-${{ runner.os }}-

      # An optional component on the stable VS 2026 install, so this leg keeps
      # the bundled clang-cl.exe against the preview headers and libraries.
      - name: Install MSVC Preview toolset
        if: matrix.preview_channel
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $instance = & $vswhere -products * -format json | ConvertFrom-Json | Select-Object -First 1
          if (-not $instance) {
            Write-Host "No VS instance found by vswhere to add the Preview toolset to"
            exit 1
          }
          $installPath = $instance.installationPath

          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList (
            'modify', '--quiet', '--norestart',
            '--installPath', "`"$installPath`"",
            '--add', 'Microsoft.VisualStudio.Component.VC.Preview.Tools.x86.x64'
          )
          # 3010 = success, reboot required
          $ok = $proc.ExitCode -eq 0 -or $proc.ExitCode -eq 3010

          $verify = & $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Preview.Tools.x86.x64 -format json | ConvertFrom-Json
          if (-not $ok -or -not $verify) {
            Write-Host "Preview toolset not present after setup.exe modify (exit code $($proc.ExitCode))."
            exit 1
          }

          # CMake requires the preview toolset's numeric version.
          $newest = Get-ChildItem "$installPath\VC\Tools\MSVC" -Directory |
            Sort-Object { [version]$_.Name } -Descending |
          Select-Object -First 1 -ExpandProperty Name
          echo "VC_PREVIEW_TOOLSET=$newest" >> $env:GITHUB_ENV

      - name: Report toolchain versions
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $instance = & $vswhere -products * -format json | ConvertFrom-Json | Select-Object -First 1
          if (-not $instance) {
            Write-Host "No Visual Studio instance found by vswhere"
            exit 1
          }
          $installPath = $instance.installationPath
          Write-Host "Visual Studio: $($instance.displayName) $($instance.installationVersion)"
          $toolset = if ($env:VC_PREVIEW_TOOLSET) {
            $env:VC_PREVIEW_TOOLSET
          } else {
            (Get-Content "$installPath\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          }
          Write-Host "MSVC STL toolset: $toolset"
          & "$installPath\VC\Tools\Llvm\x64\bin\clang-cl.exe" --version
          & "$installPath\VC\Tools\MSVC\$toolset\bin\Hostx64\x64\cl.exe" /Bv
          cmake --version

      # vcpkg's own x-gha backend was removed, so cache its binary packages
      # with actions/cache; the archives are named by ABI hash.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      - name: Install Boost.Test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          vcpkg install --triplet ${{ matrix.triplet }}

      # Keyed on the archives' contents: an unconditional save would add an
      # entry per run and evict this repo's other caches.
      - name: Save vcpkg binary cache
        if: >-
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      - name: Configure
        if: "!matrix.preview_channel"
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "${{ matrix.generator }}" -A ${{ matrix.arch }}
          -T ${{ matrix.toolset }}
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Configure (preview MSVC STL)
        if: matrix.preview_channel
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "${{ matrix.generator }}" -A ${{ matrix.arch }}
          -T "ClangCL,version=$env:VC_PREVIEW_TOOLSET,host=x64"
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ matrix.build_type }} -v

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
