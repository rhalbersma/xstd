name: MSVC-Analyze

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # MSVC's /analyze, in the role Clang-Tidy fills on the other side. No inputs
  # yet: the shared workflow already defaults to the qualification rung in
  # Debug, which is what Clang-Tidy runs, and the C++ Core Guidelines checkers
  # stay off until there is a reason to turn them on.
  msvc_analyze:
    uses: rhalbersma/cpp-ci/.github/workflows/msvc-analyze.yml@847e9ccde5651430e1dbe2cef53c85c1d3df0b90 # v0.6.1
