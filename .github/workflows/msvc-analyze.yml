name: MSVC-Analyze

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # MSVC's /analyze, in the role Clang-Tidy fills on the other side. Still no
  # inputs, but the default underneath moved: v0.7.0 runs all three MSVC rungs
  # rather than the qualification one alone, which is what Clang-Tidy has done
  # since v0.6.0. The C++ Core Guidelines checkers stay off until there is a
  # reason to turn them on.
  msvc_analyze:
    uses: rhalbersma/cpp-ci/.github/workflows/msvc-analyze.yml@e2886b13f6fcd1eceb231652f816b016de41be1d # v0.8.1
