name: CodeQL

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  codeql:
    uses: rhalbersma/cpp-ci/.github/workflows/codeql.yml@761f20d7d737d4e0c5a942eb2f1becf8e8edea75 # v0.3.1
