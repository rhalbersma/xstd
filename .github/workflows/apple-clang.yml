name: Apple Clang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    # Apple does not publish an open-source Apple Clang trunk/nightly. Test
    # the latest stable Xcode release from each of the two supported series.
    name: Apple Clang ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Xcode 16.4
            os: macos-15
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
          - label: Xcode 26.6
            os: macos-26
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_CACHE_KEY: vcpkg-apple-clang-${{ matrix.os }}-

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report toolchain versions
        run: |
          xcodebuild -version
          clang++ --version
          cmake --version

      # x-gha, vcpkg's built-in GitHub Actions cache backend, was removed
      # from vcpkg; actions/cache still works, so cache the directory vcpkg
      # writes its binary packages to. The archives in it are named by
      # vcpkg's ABI hash, so a stale entry is ignored rather than reused.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      # GitHub-hosted macOS runners are arm64 since macos-14; vcpkg's
      # arm64-osx triplet builds Boost.Test with the selected Xcode, so its
      # libc++ ABI always matches the compiler under test.
      - name: Install Boost.Test
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          vcpkg install --triplet arm64-osx

      # Save only when the archives changed, keyed on their contents: an
      # unconditional save would add an entry per run, evicting this repo's
      # other caches, or warn about a duplicate key on every cache hit.
      - name: Save vcpkg binary cache
        if: >-
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=arm64-osx

      - name: Build
        run: cmake --build build -v

      - name: Test
        run: ctest --test-dir build --output-on-failure
