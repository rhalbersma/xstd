name: Sanitizers

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: GCC 15 ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan
            flags: -fsanitize=address -fno-omit-frame-pointer -g
            env: ASAN_OPTIONS=detect_leaks=0
          - name: UBSan
            flags: -fsanitize=undefined -fno-sanitize-recover=undefined -g
            env: UBSAN_OPTIONS=print_stacktrace=1
    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_CACHE_KEY: vcpkg-sanitizers-${{ matrix.name }}-

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image writes APT::Acquire::Retries, but apt reads this
      # setting from the Acquire group, so the image's value never takes
      # effect. Set the key apt actually consults: without it a transient
      # 5xx from a mirror or PPA fails the install on the first attempt,
      # which is how one Launchpad brownout reddened three required legs.
      - name: Make apt retry transient download failures
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99-retries > /dev/null

      - name: Install GCC 15
        run: |
          # Retried for the reason given in gcc.yml: the ppa: shorthand goes
          # through Launchpad's web API, which Acquire::Retries does not cover.
          for i in 1 2 3; do
            if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
          sudo apt-get update
          sudo apt-get install -y g++-15

      - name: Report toolchain versions
        run: |
          gcc-15 --version
          g++-15 --version
          cmake --version

      # x-gha, vcpkg's built-in GitHub Actions cache backend, was removed
      # from vcpkg; actions/cache still works, so cache the directory vcpkg
      # writes its binary packages to. The archives in it are named by
      # vcpkg's ABI hash, so a stale entry is ignored rather than reused.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      - name: Install Boost.Test
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          vcpkg install --triplet x64-linux

      # Save only when the archives changed, keyed on their contents: an
      # unconditional save would add an entry per run, evicting this repo's
      # other caches, or warn about a duplicate key on every cache hit.
      - name: Save vcpkg binary cache
        if: >-
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc-15
          -DCMAKE_CXX_COMPILER=g++-15
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build -v

      - name: Test
        run: env ${{ matrix.env }} ctest --test-dir build --output-on-failure
