name: Sanitizers

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # No inputs: this library is C++23 and builds on every stable rung, which is
  # what the shared workflow defaults to. A repository needing a newer compiler
  # names the rung instead of the version, and this one may yet.
  sanitizers:
    uses: rhalbersma/cpp-ci/.github/workflows/sanitizers.yml@15a225938247fbc85e06704db88e641e8acd3454 # cpp-ci sanitizers pilot
