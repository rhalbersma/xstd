name: Scorecard

permissions:
  contents: read

# No concurrency group here, deliberately. Since v0.2.1 the shared workflow
# declares one for its own push and schedule runs, and inside a called workflow
# github.workflow and github.ref both name the caller -- so a group declared
# here computes the same string the callee computes, and the callee's
# cancel-in-progress cancels the very run that called it, before any job starts.
# Serialisation is not lost: the callee's group is built from this workflow's
# name and ref, so two runs of this stub still collide there and the later one
# wins.

on:
  push:
    branches: [ main ]
  branch_protection_rule:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

jobs:
  # scorecard-action refuses to publish results from a workflow whose top-level
  # permissions grant write: the token that signs them must be scoped to the job
  # that needs it. A workflow-level grant fails the upload with HTTP 400 while
  # the job still reports success, so the badge silently stops moving. See
  # https://github.com/ossf/scorecard-action#workflow-restrictions
  scorecard:
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    uses: rhalbersma/cpp-ci/.github/workflows/scorecard.yml@847e9ccde5651430e1dbe2cef53c85c1d3df0b90 # v0.6.1
