name: Scorecard

permissions:
  contents: read
  security-events: write
  id-token: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  branch_protection_rule:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

jobs:
  scorecard:
    uses: rhalbersma/cpp-ci/.github/workflows/scorecard.yml@1fa5b7073c07ef598bb619652a422c821ee18ca0 # v0.2.0
