name: MinGW

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: MinGW ${{ matrix.label }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "15"
            tag_prefix: "15."
            snapshot: false
          - label: "16"
            tag_prefix: "16."
            snapshot: false
          - label: 17-SVN
            tag_prefix: ""
            snapshot: true
    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_CACHE_KEY: vcpkg-mingw-${{ matrix.label }}-

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # WinLibs publishes dated releases rather than a package feed, so pinning
      # a major version means querying the API; a tag goes stale on the respin.
      - name: Resolve WinLibs release
        id: winlibs
        shell: bash
        run: |
          releases=$(curl -fsSL --retry 3 --retry-delay 2 -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/brechtsanders/winlibs_mingw/releases?per_page=100")

          if [ "${{ matrix.snapshot }}" = "true" ]; then
            tag=$(echo "$releases" | grep '"tag_name"' | cut -d'"' -f4 | grep -i snapshot | head -1)
          else
            tag=$(echo "$releases" | grep '"tag_name"' | cut -d'"' -f4 | grep -E "^${{ matrix.tag_prefix }}" | grep -i ucrt | head -1)
          fi

          if [ -z "$tag" ]; then
            echo "No matching WinLibs release found for '${{ matrix.label }}'" >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            # A missing snapshot is expected between release branches; a
            # missing pinned stable major has to fail the job.
            [ "${{ matrix.snapshot }}" = "true" ] && exit 0 || exit 1
          fi

          asset=$(echo "$releases" | python3 -c "
          import json, sys
          releases = json.load(sys.stdin)
          for r in releases:
              if r['tag_name'] != '$tag':
                  continue
              for a in r['assets']:
                  n = a['name']
                  if n.startswith('winlibs-x86_64-posix-seh-gcc-') and 'mingw-w64ucrt-' in n and n.endswith('.7z'):
                      print(a['browser_download_url'])
                      sys.exit(0)
          ")

          if [ -z "$asset" ]; then
            echo "No matching win64 UCRT asset found in release '$tag'" >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            [ "${{ matrix.snapshot }}" = "true" ] && exit 0 || exit 1
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$asset" >> "$GITHUB_OUTPUT"

      - name: Cache WinLibs toolchain
        if: steps.winlibs.outputs.found == 'true'
        id: cache-winlibs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: C:\winlibs
          key: winlibs-${{ steps.winlibs.outputs.tag }}

      # Into an isolated directory rather than C:/, which already has a
      # mingw64: 7-Zip's overwrite prompt hangs with no TTY to answer it.
      - name: Install WinLibs toolchain
        if: steps.winlibs.outputs.found == 'true' && steps.cache-winlibs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL --retry 3 --retry-delay 2 "${{ steps.winlibs.outputs.url }}" -o winlibs.7z
          7z x winlibs.7z -oC:/winlibs_extract
          mv C:/winlibs_extract/mingw64 C:/winlibs
          rm -rf C:/winlibs_extract

      # -Encoding utf8 writes a BOM, which stops $GITHUB_PATH being parsed at
      # all and leaves every executable unable to find the runtime DLLs.
      - name: Add WinLibs to PATH
        if: steps.winlibs.outputs.found == 'true'
        run: echo "C:\winlibs\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8NoBOM -Append

      - name: Report toolchain versions
        if: steps.winlibs.outputs.found == 'true'
        run: |
          gcc --version
          g++ --version
          cmake --version

      # vcpkg's own x-gha backend was removed, so cache its binary packages
      # with actions/cache; the archives are named by ABI hash.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        if: steps.winlibs.outputs.found == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      # x64-mingw-dynamic builds against whatever gcc resolves to on PATH,
      # now the pinned WinLibs toolchain, so the libstdc++ ABI matches.
      - name: Install Boost.Test
        if: steps.winlibs.outputs.found == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          vcpkg install --triplet x64-mingw-dynamic

      # Keyed on the archives' contents: an unconditional save would add an
      # entry per run and evict this repo's other caches.
      - name: Save vcpkg binary cache
        if: >-
          steps.winlibs.outputs.found == 'true' &&
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      # Ninja rather than "MinGW Makefiles", which wants a mingw32-make.exe
      # WinLibs does not bundle; not preinstalled either, hence the choco.
      - name: Install Ninja
        if: steps.winlibs.outputs.found == 'true'
        run: choco install ninja -y

      # Explicit: Ninja is single-config and vcpkg defaults to Debug, whose
      # Boost.Test DLL the release-only z-applocal step never deploys.
      - name: Configure
        if: steps.winlibs.outputs.found == 'true'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic

      - name: Build
        if: steps.winlibs.outputs.found == 'true'
        run: cmake --build build -v

      - name: Test
        if: steps.winlibs.outputs.found == 'true'
        run: ctest --test-dir build --output-on-failure
