name: GCC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: GCC ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "15"
            version: 15
            cc: gcc-15
            cxx: g++-15
            trunk: false
          - label: "16"
            version: 16
            cc: gcc-16
            cxx: g++-16
            trunk: false
          - label: 17-SVN
            version: 17
            cc: gcc-17
            cxx: g++-17
            trunk: true
    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_CACHE_KEY: vcpkg-gcc-${{ matrix.label }}-

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image writes APT::Acquire::Retries, but apt reads this
      # setting from the Acquire group, so the image's value never takes
      # effect. Set the key apt actually consults: without it a transient
      # 5xx from a mirror or PPA fails the install on the first attempt,
      # which is how one Launchpad brownout reddened three required legs.
      - name: Make apt retry transient download failures
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99-retries > /dev/null

      - name: Install GCC ${{ matrix.version }} (stable)
        if: "!matrix.trunk"
        run: |
          # add-apt-repository resolves a ppa: shorthand through Launchpad's
          # web API via launchpadlib, before apt is involved at all, so the
          # Acquire::Retries setting above does not cover it: that governs
          # apt's own downloads. A truncated response here (IncompleteRead)
          # fails the step outright, so retry the call itself.
          for i in 1 2 3; do
            if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cxx }}

      # Installs Jonathan Wakely's binary snapshot of GCC trunk (see
      # https://jwakely.github.io/pkg-gcc-latest/). Not an official GCC
      # release, but this leg is required like any other: xstd tracks trunk
      # deliberately and expects to adapt to it rather than ignore it.
      # The version banner includes the snapshot's build date, which we use
      # below to key the Boost cache so it invalidates whenever the snapshot
      # actually changes.
      - name: Install GCC trunk snapshot
        if: matrix.trunk
        id: gcc-trunk
        run: |
          wget -q --tries=3 --waitretry=5 --retry-on-http-error=429,500,502,503,504 https://kayari.org/gcc-latest/gcc-latest.deb -O gcc-latest.deb
          sudo dpkg -i gcc-latest.deb || sudo apt-get install -f -y
          sudo ln -sf /opt/gcc-latest/bin/gcc        /usr/bin/${{ matrix.cc }}
          sudo ln -sf /opt/gcc-latest/bin/g++        /usr/bin/${{ matrix.cxx }}
          sudo ln -sf /opt/gcc-latest/bin/gcov       /usr/bin/gcov-${{ matrix.version }}
          sudo ln -sf /opt/gcc-latest/bin/gcov-dump  /usr/bin/gcov-dump-${{ matrix.version }}
          sudo ln -sf /opt/gcc-latest/bin/gcov-tool  /usr/bin/gcov-tool-${{ matrix.version }}
          sudo ln -sf /opt/gcc-latest/bin/gcc-ar     /usr/bin/gcc-ar-${{ matrix.version }}
          sudo ln -sf /opt/gcc-latest/bin/gcc-nm     /usr/bin/gcc-nm-${{ matrix.version }}
          sudo ln -sf /opt/gcc-latest/bin/gcc-ranlib /usr/bin/gcc-ranlib-${{ matrix.version }}
          printf '%s\n' \
            '# Multiarch support' \
            /opt/gcc-latest/lib \
            /opt/gcc-latest/lib64 | sudo tee /etc/ld.so.conf.d/gcc-latest.conf > /dev/null
          sudo ldconfig
          ${{ matrix.cc }} --version
          ${{ matrix.cxx }} --version
          echo "version=$(${{ matrix.cxx }} --version | head -1)" >> "$GITHUB_OUTPUT"

      - name: Report toolchain versions
        run: |
          ${{ matrix.cc }} --version
          ${{ matrix.cxx }} --version
          cmake --version

      # x-gha, vcpkg's built-in GitHub Actions cache backend, was removed
      # from vcpkg; actions/cache still works, so cache the directory vcpkg
      # writes its binary packages to. The archives in it are named by
      # vcpkg's ABI hash, so a stale entry is ignored rather than reused.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        if: "!matrix.trunk"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      # vcpkg is used instead of the distro's boost package so xstd tracks
      # recent Boost releases regardless of what the OS bundles. All
      # apt-installed GCCs share the system libstdc++, so ABI is consistent
      # regardless of which one built vcpkg's Boost.
      - name: Install Boost.Test (stable)
        if: "!matrix.trunk"
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          vcpkg install --triplet x64-linux

      # Save only when the archives changed, keyed on their contents: an
      # unconditional save would add an entry per run, evicting this repo's
      # other caches, or warn about a duplicate key on every cache hit.
      - name: Save vcpkg binary cache
        if: >-
          !matrix.trunk &&
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      # vcpkg's prebuilt Boost.Test is compiled by an older, ABI-stable GCC.
      # Linking it against the trunk snapshot breaks
      # Boost.Test's runtime parameter registration ("Test setup error:
      # Parameter catch_system_errors"), because the snapshot ships its own,
      # newer libstdc++ (unlike apt-installed compilers, which all share the
      # system one). Building Boost.Test from source with the same trunk
      # compiler avoids the mismatch. The Boost version is resolved via the
      # GitHub API so this doesn't go stale; the resulting build is cached
      # (keyed on the exact trunk snapshot + Boost version) since a rebuild
      # otherwise costs several minutes on every run.
      - name: Resolve latest Boost version
        if: matrix.trunk
        id: boost-version
        run: |
          # /releases/latest can return a beta (boostorg doesn't always flag
          # them as prerelease), so list releases and keep strict boost-X.Y.Z
          boost_tag=$(curl -fsSL --retry 3 --retry-delay 2 -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/boostorg/boost/releases?per_page=20" | grep '"tag_name"' | cut -d'"' -f4 | grep -E -m1 '^boost-[0-9]+\.[0-9]+\.[0-9]+$')
          echo "tag=$boost_tag" >> "$GITHUB_OUTPUT"

      - name: Cache Boost (trunk)
        if: matrix.trunk
        id: cache-boost-trunk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /opt/boost-latest
          key: boost-trunk-${{ runner.os }}-${{ steps.gcc-trunk.outputs.version }}-${{ steps.boost-version.outputs.tag }}

      - name: Install Boost.Test (from source, trunk)
        if: matrix.trunk && steps.cache-boost-trunk.outputs.cache-hit != 'true'
        run: |
          boost_tag=${{ steps.boost-version.outputs.tag }}
          boost_ver=${boost_tag#boost-}
          wget -q --tries=3 --waitretry=5 --retry-on-http-error=429,500,502,503,504 "https://github.com/boostorg/boost/releases/download/${boost_tag}/boost-${boost_ver}-b2-nodocs.tar.gz" -O boost.tar.gz
          tar xzf boost.tar.gz
          cd "boost-${boost_ver}"
          echo "using gcc : trunk : ${{ matrix.cxx }} ;" > user-config.jam
          ./bootstrap.sh --prefix=/opt/boost-latest --with-libraries=test
          ./b2 install -j"$(nproc)" --prefix=/opt/boost-latest --user-config=user-config.jam toolset=gcc-trunk variant=release link=static threading=multi

      - name: Configure (stable)
        if: "!matrix.trunk"
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake

      - name: Configure (trunk)
        if: matrix.trunk
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_PREFIX_PATH=/opt/boost-latest
          -DBoost_NO_SYSTEM_PATHS=ON

      - name: Build
        run: cmake --build build -v

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Verify the install rules and that a downstream consumer can locate
      # the installed package via find_package(xstd CONFIG). Once per
      # matrix (on the latest stable leg) is enough: the install/consume
      # path is compiler-independent.
      - name: Install (package smoke test)
        if: matrix.version == 16
        run: cmake --install build --prefix "$GITHUB_WORKSPACE/xstd-prefix"

      - name: Consume installed package
        if: matrix.version == 16
        run: |
          mkdir consumer
          cd consumer
          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(consumer LANGUAGES CXX)
          find_package(xstd 0.1.0 CONFIG REQUIRED)
          add_executable(main main.cpp)
          target_link_libraries(main PRIVATE xstd::xstd)
          EOF
          cat > main.cpp << 'EOF'
          #include <xstd/concepts.hpp>
          #include <xstd/cstdlib.hpp>
          #include <xstd/type_traits.hpp>
          #include <xstd/utility.hpp>
          #include <complex>
          #include <format>
          #include <string>
          #include <type_traits>

          enum class color : unsigned { red = 1 };

          int main()
          {
                  static_assert(xstd::enumeration<color>);
                  static_assert(xstd::is_specialization_of_v<std::complex<double>, std::complex>);
                  static_assert(decltype(xstd::to_underlying(std::integral_constant<color, color::red>()))::value == 1);
                  static_assert(xstd::euclidean_div(-8, 3).rem == 1);

                  auto const d = xstd::floored_div(-8, 3);
                  return std::format("{}", d) == "(-3, 1)" ? 0 : 1;
          }
          EOF
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/xstd-prefix"
          cmake --build build -v
          ./build/main
