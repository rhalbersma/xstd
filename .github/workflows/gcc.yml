name: GCC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: GCC ${{ matrix.label }} ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        label: ["15", "16", "17-SVN"]
        include:
          - label: "15"
            version: 15
            cc: gcc-15
            cxx: g++-15
            trunk: false
          - label: "16"
            version: 16
            cc: gcc-16
            cxx: g++-16
            trunk: false
          - label: 17-SVN
            version: 17
            cc: gcc-17
            cxx: g++-17
            trunk: true
    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_CACHE_KEY: vcpkg-gcc-${{ matrix.label }}-

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image writes APT::Acquire::Retries, which apt does not read;
      # this is the key it consults, so a transient 5xx retries.
      - name: Make apt retry transient download failures
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99-retries > /dev/null

      - name: Install GCC ${{ matrix.version }} (stable)
        if: "!matrix.trunk"
        run: |
          # add-apt-repository resolves a ppa: through Launchpad's web API,
          # which the Acquire::Retries above does not cover, so retry it here
          for i in 1 2 3; do
            if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cxx }}

      # Jonathan Wakely's binary snapshot of GCC trunk
      # (https://jwakely.github.io/pkg-gcc-latest/), required like any leg.
      - name: Install GCC trunk snapshot
        if: matrix.trunk
        run: |
          wget -q --tries=3 --waitretry=5 --retry-on-http-error=429,500,502,503,504 https://kayari.org/gcc-latest/gcc-latest.deb -O gcc-latest.deb
          # Deliberately the moving URL, so this leg keeps tracking trunk; upstream
          # publishes neither checksums nor signatures, so record what arrived.
          dpkg-deb -f gcc-latest.deb Package Version
          sha256sum gcc-latest.deb
          sudo dpkg -i gcc-latest.deb || sudo apt-get install -f -y
          sudo ln -sf /opt/gcc-latest/bin/gcc        /usr/bin/${{ matrix.cc }}
          sudo ln -sf /opt/gcc-latest/bin/g++        /usr/bin/${{ matrix.cxx }}
          sudo ln -sf /opt/gcc-latest/bin/gcov       /usr/bin/gcov-${{ matrix.version }}
          sudo ln -sf /opt/gcc-latest/bin/gcov-dump  /usr/bin/gcov-dump-${{ matrix.version }}
          sudo ln -sf /opt/gcc-latest/bin/gcov-tool  /usr/bin/gcov-tool-${{ matrix.version }}
          sudo ln -sf /opt/gcc-latest/bin/gcc-ar     /usr/bin/gcc-ar-${{ matrix.version }}
          sudo ln -sf /opt/gcc-latest/bin/gcc-nm     /usr/bin/gcc-nm-${{ matrix.version }}
          sudo ln -sf /opt/gcc-latest/bin/gcc-ranlib /usr/bin/gcc-ranlib-${{ matrix.version }}
          printf '%s\n' \
            '# Multiarch support' \
            /opt/gcc-latest/lib \
            /opt/gcc-latest/lib64 | sudo tee /etc/ld.so.conf.d/gcc-latest.conf > /dev/null
          sudo ldconfig
          ${{ matrix.cc }} --version
          ${{ matrix.cxx }} --version

      - name: Report toolchain versions
        run: |
          ${{ matrix.cc }} --version
          ${{ matrix.cxx }} --version
          cmake --version

      # vcpkg's own x-gha backend was removed, so cache its binary packages
      # with actions/cache; the archives are named by ABI hash.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      # vcpkg rather than the distro's boost, and an overlay triplet so
      # Boost.Test gets the GCC under test and its own libstdc++.
      - name: Install Boost.Test
        env:
          VCPKG_GCC_VERSION: ${{ matrix.version }}
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          vcpkg install \
            --triplet x64-linux-gcc \
            --overlay-triplets "$GITHUB_WORKSPACE/.github/vcpkg/triplets"

      # Keyed on the archives' contents: an unconditional save would add an
      # entry per run and evict this repo's other caches.
      - name: Save vcpkg binary cache
        if: >-
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      - name: Configure
        env:
          # The overlay triplet is evaluated again by the vcpkg CMake
          # integration, so retain the compiler selection after install.
          VCPKG_GCC_VERSION: ${{ matrix.version }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-linux-gcc
          -DVCPKG_OVERLAY_TRIPLETS=$GITHUB_WORKSPACE/.github/vcpkg/triplets

      - name: Build
        run: cmake --build build -v

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The install rules, and find_package(xstd CONFIG) downstream. Once per
      # matrix is enough, the path being compiler-independent.
      - name: Install (package smoke test)
        if: matrix.version == 16
        run: cmake --install build --prefix "$GITHUB_WORKSPACE/xstd-prefix"

      - name: Consume installed package
        if: matrix.version == 16
        run: |
          mkdir consumer
          cd consumer
          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(consumer LANGUAGES CXX)
          find_package(xstd 0.1.0 CONFIG REQUIRED)
          add_executable(main main.cpp)
          target_link_libraries(main PRIVATE xstd::xstd)
          EOF
          cat > main.cpp << 'EOF'
          #include <xstd/concepts.hpp>
          #include <xstd/cstdlib.hpp>
          #include <xstd/format.hpp>
          #include <xstd/type_traits.hpp>
          #include <xstd/utility.hpp>
          #include <complex>
          #include <format>
          #include <string>
          #include <type_traits>

          enum class color : unsigned { red = 1 };

          int main()
          {
                  static_assert(xstd::is_specialization_of_v<std::complex<double>, std::complex>);
                  static_assert(decltype(xstd::to_underlying(std::integral_constant<color, color::red>()))::value == 1);
                  static_assert(xstd::div_euclid(-8, 3).remainder == 1);

                  auto const d = xstd::div_floor(-8, 3);
                  return std::format("{}", d) == "(-3, 1)" ? 0 : 1;
          }
          EOF
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/xstd-prefix"
          cmake --build build -v
          ./build/main
