name: Clang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Clang ${{ matrix.label }} ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        label: ["22", "23", "24-SVN"]
        include:
          # llvm_suffix selects the apt.llvm.org branch: a versioned suite
          # for stable and qualification, the unversioned one for development.
          - label: "22"
            version: 22
            cc: clang-22
            cxx: clang++-22
            llvm_suffix: "-22"
            gcc_version: 15
            gcc_trunk: false
            cxxflags: ""
          - label: "23"
            version: 23
            cc: clang-23
            cxx: clang++-23
            llvm_suffix: "-23"
            gcc_version: 16
            gcc_trunk: false
            cxxflags: ""
          - label: 24-SVN
            version: 24
            cc: clang-24
            cxx: clang++-24
            llvm_suffix: ""
            gcc_version: 17
            gcc_trunk: true
            cxxflags: "--gcc-toolchain=/opt/gcc-latest"
    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_CACHE_KEY: vcpkg-clang-${{ matrix.label }}-

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The apt.llvm.org suite and versioned packages directly: llvm.sh's
      # hardcoded table lags LLVM's annual rollover, and so do the metapackages.

      # The runner image writes APT::Acquire::Retries, which apt does not read;
      # this is the key it consults, so a transient 5xx retries.
      - name: Make apt retry transient download failures
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99-retries > /dev/null

      - name: Install Clang ${{ matrix.version }}
        run: |
          wget -qO- --tries=3 --waitretry=5 --retry-on-http-error=429,500,502,503,504 https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          codename=$(lsb_release -cs)
          sudo add-apt-repository -y "deb https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}${{ matrix.llvm_suffix }} main"
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ matrix.version }} \
            lldb-${{ matrix.version }} \
            lld-${{ matrix.version }} \
            clangd-${{ matrix.version }}

      # Each Clang paired with a matching libstdc++, the div_result formatter
      # needing its std::formatter<tuple>.
      - name: Install libstdc++ ${{ matrix.gcc_version }}
        if: "!matrix.gcc_trunk"
        run: |
          # Retried for the reason given in gcc.yml: the ppa: shorthand goes
          # through Launchpad's web API, which Acquire::Retries does not cover.
          for i in 1 2 3; do
            if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
          sudo apt-get update
          sudo apt-get install -y g++-${{ matrix.gcc_version }}

      - name: Install libstdc++ trunk snapshot
        if: matrix.gcc_trunk
        run: |
          wget -q --tries=3 --waitretry=5 --retry-on-http-error=429,500,502,503,504 https://kayari.org/gcc-latest/gcc-latest.deb -O gcc-latest.deb
          # Deliberately the moving URL, so this leg keeps tracking trunk; upstream
          # publishes neither checksums nor signatures, so record what arrived.
          dpkg-deb -f gcc-latest.deb Package Version
          sha256sum gcc-latest.deb
          sudo dpkg -i gcc-latest.deb || sudo apt-get install -f -y
          printf '%s\n' \
            '# Multiarch support' \
            /opt/gcc-latest/lib \
            /opt/gcc-latest/lib64 | sudo tee /etc/ld.so.conf.d/gcc-latest.conf > /dev/null
          sudo ldconfig

      - name: Report toolchain versions
        run: |
          ${{ matrix.cc }} --version
          ${{ matrix.cxx }} --version
          if [ "${{ matrix.gcc_trunk }}" = "true" ]; then
            /opt/gcc-latest/bin/g++ --version
          else
            g++-${{ matrix.gcc_version }} --version
          fi
          cmake --version

      # vcpkg's own x-gha backend was removed, so cache its binary packages
      # with actions/cache; the archives are named by ABI hash.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      # vcpkg rather than the distro's boost, and an overlay triplet so
      # Boost.Test gets the Clang and libstdc++ the tests use.
      - name: Install Boost.Test
        env:
          VCPKG_CLANG_VERSION: ${{ matrix.version }}
          VCPKG_CLANG_FLAGS: ${{ matrix.cxxflags }}
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          vcpkg install \
            --triplet x64-linux-clang \
            --overlay-triplets "$GITHUB_WORKSPACE/.github/vcpkg/triplets"

      # Keyed on the archives' contents: an unconditional save would add an
      # entry per run and evict this repo's other caches.
      - name: Save vcpkg binary cache
        if: >-
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      - name: Configure
        env:
          # The overlay triplet is evaluated again by the vcpkg CMake
          # integration, so retain the compiler selection after install.
          VCPKG_CLANG_VERSION: ${{ matrix.version }}
          VCPKG_CLANG_FLAGS: ${{ matrix.cxxflags }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          "-DCMAKE_CXX_FLAGS=${{ matrix.cxxflags }}"
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-linux-clang
          -DVCPKG_OVERLAY_TRIPLETS=$GITHUB_WORKSPACE/.github/vcpkg/triplets

      - name: Build
        run: cmake --build build -v

      - name: Test
        run: ctest --test-dir build --output-on-failure
