name: Clang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Clang ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # llvm_suffix selects the apt.llvm.org branch: a versioned suite
          # for stable and qualification, the unversioned one for development.
          - label: "22"
            version: 22
            cc: clang-22
            cxx: clang++-22
            llvm_suffix: "-22"
            gcc_version: 15
            gcc_trunk: false
            cxxflags: ""
          - label: "23"
            version: 23
            cc: clang-23
            cxx: clang++-23
            llvm_suffix: "-23"
            gcc_version: 16
            gcc_trunk: false
            cxxflags: ""
          - label: 24-SVN
            version: 24
            cc: clang-24
            cxx: clang++-24
            llvm_suffix: ""
            gcc_version: 17
            gcc_trunk: true
            cxxflags: "--gcc-toolchain=/opt/gcc-latest"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Select the apt.llvm.org suite directly rather than going through
      # llvm.sh. That script maps a version to a suite from a hardcoded
      # table which lags LLVM's annual rollover, so during the switchover it
      # can neither be asked for the new development version nor find the
      # previous one in the unversioned suite it resolves to. Naming the
      # suite ourselves sidesteps the table entirely, and it mirrors how
      # apt.llvm.org is actually laid out: a versioned suite per release,
      # and an unversioned one that always means tip of trunk.
      # Install versioned packages rather than the unversioned
      # metapackages, which lag the rename the same way and would drag in a
      # clang-N the development suite no longer carries.
      # The runner image writes APT::Acquire::Retries, but apt reads this
      # setting from the Acquire group, so the image's value never takes
      # effect. Set the key apt actually consults: without it a transient
      # 5xx from a mirror or PPA fails the install on the first attempt,
      # which is how one Launchpad brownout reddened three required legs.
      - name: Make apt retry transient download failures
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99-retries > /dev/null

      - name: Install Clang ${{ matrix.version }}
        run: |
          wget -qO- --tries=3 --waitretry=5 --retry-on-http-error=429,500,502,503,504 https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          codename=$(lsb_release -cs)
          sudo add-apt-repository -y "deb https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}${{ matrix.llvm_suffix }} main"
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ matrix.version }} \
            lldb-${{ matrix.version }} \
            lld-${{ matrix.version }} \
            clangd-${{ matrix.version }}

      # xstd/cstdlib.hpp's div_t formatter needs libstdc++'s <format> (and,
      # more specifically, its std::formatter<tuple> support), so each
      # Clang version is paired with the matching libstdc++ release.
      - name: Install libstdc++ ${{ matrix.gcc_version }}
        if: "!matrix.gcc_trunk"
        run: |
          # Retried for the reason given in gcc.yml: the ppa: shorthand goes
          # through Launchpad's web API, which Acquire::Retries does not cover.
          for i in 1 2 3; do
            if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
          sudo apt-get update
          sudo apt-get install -y g++-${{ matrix.gcc_version }}

      - name: Install libstdc++ trunk snapshot
        if: matrix.gcc_trunk
        id: gcc-trunk
        run: |
          wget -q --tries=3 --waitretry=5 --retry-on-http-error=429,500,502,503,504 https://kayari.org/gcc-latest/gcc-latest.deb -O gcc-latest.deb
          sudo dpkg -i gcc-latest.deb || sudo apt-get install -f -y
          printf '%s\n' \
            '# Multiarch support' \
            /opt/gcc-latest/lib \
            /opt/gcc-latest/lib64 | sudo tee /etc/ld.so.conf.d/gcc-latest.conf > /dev/null
          sudo ldconfig
          echo "version=$(/opt/gcc-latest/bin/g++ --version | head -1)" >> "$GITHUB_OUTPUT"

      - name: Report toolchain versions
        run: |
          ${{ matrix.cc }} --version
          ${{ matrix.cxx }} --version
          if [ "${{ matrix.gcc_trunk }}" = "true" ]; then
            /opt/gcc-latest/bin/g++ --version
          else
            g++-${{ matrix.gcc_version }} --version
          fi
          cmake --version

      # Export the two env vars vcpkg's "x-gha" binary source needs to talk
      # to the GitHub Actions cache service, so built packages are reused
      # across runs instead of recompiled from scratch every time.
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # vcpkg is used instead of the distro's boost package so xstd tracks
      # recent Boost releases regardless of what the OS bundles.
      - name: Install Boost.Test
        if: "!matrix.gcc_trunk"
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CXXFLAGS: ${{ matrix.cxxflags }}
        run: >
          vcpkg install
          --triplet x64-linux

      # The GCC trunk snapshot ships a newer libstdc++ than the runner.
      # Rebuild Boost.Test with the same Clang/libstdc++ pair; a cached
      # system-libstdc++ Boost fails at runtime due to the ABI mismatch.
      - name: Resolve latest Boost version
        if: matrix.gcc_trunk
        id: boost-version
        run: |
          boost_tag=$(curl -fsSL --retry 3 --retry-delay 2 -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/boostorg/boost/releases?per_page=20" | grep '"tag_name"' | cut -d'"' -f4 | grep -E -m1 '^boost-[0-9]+\.[0-9]+\.[0-9]+$')
          echo "tag=$boost_tag" >> "$GITHUB_OUTPUT"

      - name: Cache Boost (trunk)
        if: matrix.gcc_trunk
        id: cache-boost-trunk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /opt/boost-latest
          key: boost-clang-trunk-${{ runner.os }}-${{ matrix.version }}-${{ steps.gcc-trunk.outputs.version }}-${{ steps.boost-version.outputs.tag }}

      - name: Install Boost.Test from source
        if: matrix.gcc_trunk && steps.cache-boost-trunk.outputs.cache-hit != 'true'
        run: |
          boost_tag=${{ steps.boost-version.outputs.tag }}
          boost_ver=${boost_tag#boost-}
          wget -q --tries=3 --waitretry=5 --retry-on-http-error=429,500,502,503,504 "https://github.com/boostorg/boost/releases/download/${boost_tag}/boost-${boost_ver}-b2-nodocs.tar.gz" -O boost.tar.gz
          tar xzf boost.tar.gz
          cd "boost-${boost_ver}"
          echo "using clang : trunk : ${{ matrix.cxx }} : <cxxflags>${{ matrix.cxxflags }} <linkflags>${{ matrix.cxxflags }} ;" > user-config.jam
          ./bootstrap.sh --prefix=/opt/boost-latest --with-libraries=test
          ./b2 install -j"$(nproc)" --prefix=/opt/boost-latest --user-config=user-config.jam toolset=clang-trunk variant=release link=static threading=multi

      - name: Configure (stable)
        if: "!matrix.gcc_trunk"
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          "-DCMAKE_CXX_FLAGS=${{ matrix.cxxflags }}"
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake

      - name: Configure (trunk)
        if: matrix.gcc_trunk
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          "-DCMAKE_CXX_FLAGS=${{ matrix.cxxflags }}"
          -DCMAKE_PREFIX_PATH=/opt/boost-latest
          -DBoost_NO_SYSTEM_PATHS=ON

      - name: Build
        run: cmake --build build -v

      - name: Test
        run: ctest --test-dir build --output-on-failure
