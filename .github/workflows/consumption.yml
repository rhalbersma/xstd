name: Consumption

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: GCC 15 consume
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image writes APT::Acquire::Retries, which apt does not read;
      # this is the key it consults, so a transient 5xx retries.
      - name: Make apt retry transient download failures
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99-retries > /dev/null

      - name: Install GCC 15
        run: |
          # Retried for the reason given in gcc.yml: the ppa: shorthand goes
          # through Launchpad's web API, which Acquire::Retries does not cover.
          for i in 1 2 3; do
            if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; then break; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            sleep $((i * 5))
          done
          sudo apt-get update
          sudo apt-get install -y g++-15

      - name: Report toolchain versions
        run: |
          gcc-15 --version
          g++-15 --version
          cmake --version

      # Only the three consumption models the README documents, so
      # -DBUILD_TESTING=OFF drops the need for vcpkg and Boost.Test here.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=gcc-15
          -DCMAKE_CXX_COMPILER=g++-15
          -DBUILD_TESTING=OFF

      - name: Install
        run: cmake --install build --prefix "$GITHUB_WORKSPACE/xstd-prefix"

      - name: Consume installed package
        run: |
          mkdir consumer
          cd consumer
          cat > CMakeLists.txt << 'CMAKE'
          cmake_minimum_required(VERSION 3.28)
          project(consumer LANGUAGES CXX)
          find_package(xstd 0.1.0 CONFIG REQUIRED)
          add_executable(main main.cpp)
          target_link_libraries(main PRIVATE xstd::xstd)
          CMAKE
          cat > main.cpp << 'CPP'
          #include <xstd/concepts.hpp>
          #include <xstd/cstdlib.hpp>
          #include <xstd/format.hpp>
          #include <xstd/type_traits.hpp>
          #include <xstd/utility.hpp>
          #include <complex>
          #include <format>
          #include <string>
          #include <type_traits>

          enum class color : unsigned { red = 1 };

          int main()
          {
                  static_assert(xstd::is_specialization_of_v<std::complex<double>, std::complex>);
                  static_assert(decltype(xstd::to_underlying(std::integral_constant<color, color::red>()))::value == 1);
                  static_assert(xstd::euclidean_div(-8, 3).rem == 1);

                  auto const d = xstd::floored_div(-8, 3);
                  return std::format("{}", d) == "(-3, 1)" ? 0 : 1;
          }
          CPP
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER=g++-15 \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/xstd-prefix"
          cmake --build build -v
          ./build/main


      - name: Consume with add_subdirectory
        run: |
          mkdir consumer-add-subdirectory
          cd consumer-add-subdirectory
          cat > CMakeLists.txt << 'CMAKE'
          cmake_minimum_required(VERSION 3.28)
          project(consumer_add_subdirectory LANGUAGES CXX)
          # no BUILD_TESTING workaround: xstd builds its tests only as the
          # top-level project, and this configure would fail if that regressed
          add_subdirectory("$ENV{GITHUB_WORKSPACE}" xstd-build)
          add_executable(main main.cpp)
          target_link_libraries(main PRIVATE xstd::xstd)
          CMAKE
          cat > main.cpp << 'CPP'
          #include <xstd/concepts.hpp>
          #include <xstd/cstdlib.hpp>
          #include <xstd/format.hpp>
          #include <xstd/type_traits.hpp>
          #include <xstd/utility.hpp>
          #include <complex>
          #include <format>
          #include <type_traits>

          enum class color : unsigned { red = 1 };

          int main()
          {
                  static_assert(xstd::is_specialization_of_v<std::complex<double>, std::complex>);
                  static_assert(decltype(xstd::to_underlying(std::integral_constant<color, color::red>()))::value == 1);
                  auto const d = xstd::euclidean_div(-8, 3);
                  return std::format("{}", d) == "(-3, 1)" ? 0 : 1;
          }
          CPP
          cmake -S . -B build -DCMAKE_CXX_COMPILER=g++-15
          cmake --build build -v
          ./build/main

      - name: Consume with FetchContent
        run: |
          mkdir consumer-fetch-content
          cd consumer-fetch-content
          cat > CMakeLists.txt << 'CMAKE'
          cmake_minimum_required(VERSION 3.28)
          project(consumer_fetch_content LANGUAGES CXX)
          include(FetchContent)
          FetchContent_Declare(xstd SOURCE_DIR "$ENV{GITHUB_WORKSPACE}")
          FetchContent_MakeAvailable(xstd)
          add_executable(main main.cpp)
          target_link_libraries(main PRIVATE xstd::xstd)
          CMAKE
          cat > main.cpp << 'CPP'
          #include <xstd/concepts.hpp>
          #include <xstd/cstdlib.hpp>
          #include <xstd/format.hpp>
          #include <xstd/type_traits.hpp>
          #include <xstd/utility.hpp>
          #include <complex>
          #include <format>
          #include <type_traits>

          enum class color : unsigned { red = 1 };

          int main()
          {
                  static_assert(xstd::is_specialization_of_v<std::complex<double>, std::complex>);
                  static_assert(decltype(xstd::to_underlying(std::integral_constant<color, color::red>()))::value == 1);
                  auto const d = xstd::floored_div(-8, 3);
                  return std::format("{}", d) == "(-3, 1)" ? 0 : 1;
          }
          CPP
          cmake -S . -B build -DCMAKE_CXX_COMPILER=g++-15
          cmake --build build -v
          ./build/main
