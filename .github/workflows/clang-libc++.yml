name: Clang libc++

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Clang ${{ matrix.label }} libc++
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # llvm_suffix selects the apt.llvm.org branch: a versioned suite
          # for stable and qualification, the unversioned one for development.
          - label: "22"
            version: 22
            llvm_suffix: "-22"
          - label: "23"
            version: 23
            llvm_suffix: "-23"
          - label: 24-SVN
            version: 24
            llvm_suffix: ""
    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_CACHE_KEY: vcpkg-clang-libcxx-${{ matrix.label }}-

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # See clang.yml for why the suite is named directly, not left to llvm.sh.

      # The runner image writes APT::Acquire::Retries, which apt does not read;
      # this is the key it consults, so a transient 5xx retries.
      - name: Make apt retry transient download failures
        run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99-retries > /dev/null

      - name: Install Clang and libc++ ${{ matrix.version }}
        run: |
          wget -qO- --tries=3 --waitretry=5 --retry-on-http-error=429,500,502,503,504 https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          codename=$(lsb_release -cs)
          sudo add-apt-repository -y "deb https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}${{ matrix.llvm_suffix }} main"
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ matrix.version }} \
            lldb-${{ matrix.version }} \
            lld-${{ matrix.version }} \
            clangd-${{ matrix.version }} \
            libc++-${{ matrix.version }}-dev \
            libc++abi-${{ matrix.version }}-dev

      - name: Report toolchain versions
        run: |
          clang-${{ matrix.version }} --version
          clang++-${{ matrix.version }} --version
          dpkg-query -W -f='${Package} ${Version}\n' \
            libc++-${{ matrix.version }}-dev libc++abi-${{ matrix.version }}-dev
          cmake --version

      # vcpkg's own x-gha backend was removed, so cache its binary packages
      # with actions/cache; the archives are named by ABI hash.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      # The overlay triplet rebuilds Boost.Test with the same Clang and
      # libc++ as xstd, so the two do not mix standard libraries.
      - name: Install Boost.Test
        env:
          VCPKG_CLANG_VERSION: ${{ matrix.version }}
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          vcpkg install \
            --triplet x64-linux-libcxx \
            --overlay-triplets "$GITHUB_WORKSPACE/.github/vcpkg/triplets"

      # Keyed on the archives' contents: an unconditional save would add an
      # entry per run and evict this repo's other caches.
      - name: Save vcpkg binary cache
        if: >-
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      - name: Configure
        env:
          # The overlay triplet is evaluated again by the vcpkg CMake
          # integration, so retain the compiler selection after install.
          VCPKG_CLANG_VERSION: ${{ matrix.version }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-${{ matrix.version }}
          -DCMAKE_CXX_COMPILER=clang++-${{ matrix.version }}
          -DCMAKE_CXX_FLAGS=-stdlib=libc++
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-linux-libcxx
          -DVCPKG_OVERLAY_TRIPLETS=$GITHUB_WORKSPACE/.github/vcpkg/triplets

      - name: Build
        run: cmake --build build -v

      - name: Test
        run: ctest --test-dir build --output-on-failure
